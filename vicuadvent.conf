# ================================
# HTTP (80) -> HTTPS + ACME
# ================================
server {
    listen 80;
    listen [::]:80;

    server_name vicuadvent.com www.vicuadvent.com api.vicuadvent.com;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ================================
# FRONTEND (Next.js on 3000)
# + API proxy (/api -> 4000)
# + uploads served directly (/uploads -> filesystem)
# ================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name vicuadvent.com www.vicuadvent.com;

    ssl_certificate     /etc/letsencrypt/live/vicuadvent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vicuadvent.com/privkey.pem;

    # Upload limit (fix 413)
    client_max_body_size 60m;

    # --- API on same domain (FIX LOGIN 404) ---
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Serve uploaded media directly ---
    # Files are in: /var/www/turismo-app/backend/public/uploads/<file>
    location /uploads/ {
        alias /var/www/turismo-app/backend/public/uploads/;
        autoindex off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- Next.js frontend ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ================================
# BACKEND API (api.vicuadvent.com -> 4000)
# + uploads (same filesystem)
# ================================
